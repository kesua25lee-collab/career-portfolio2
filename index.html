function shrinkImage(img){let max=1600,q=.9,out='';for(let k=0;k<14;k++){const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<=CARD_MAX_CHARS)return out;if(q>.62)q-=.1;else max=Math.round(max*.85);}return out;}
async function thumbOf(dataUrl){const img=await loadImage(dataUrl);const sc=Math.min(1,260/img.width);const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.72);}

function home(){
 showPage(`<section class="page"><div class="home-grid"><div class="hero-copy"><div class="eyebrow"><span class="dot"></span>YOUR FUTURE STARTS HERE</div><h1>마장 진로<br><em>포트폴리오 제출</em></h1><p class="intro">과학이 바꾸는 세상 속, 나의 가능성을 소개해 주세요.<br>미래의 나를 담은 명함과 생각이<br>하나의 멋진 포트폴리오가 됩니다.</p><div class="theme-chips"><span class="chip">과학과 연결하기</span><span class="chip">미래 사회 상상하기</span><span class="chip">나의 진로 설계하기</span></div><div class="hero-preview" aria-hidden="true"><div class="resume-paper"><div class="mini-card"><small>MY FUTURE IDENTITY</small><strong>미래를 바꾸는<br>나의 첫 명함</strong><span>SCIENCE × CAREER</span></div><div class="mini-lines"><b>과학과 진로</b><i></i><i></i><i></i><i></i><i></i><i></i></div></div><span class="paper-tag">나만의 한 장, 나만의 미래 ↗</span></div></div><form id="start-form" class="form-card"><div class="form-kicker"><span>APPLICATION FORM</span><span class="pill">● 포트폴리오 만들기</span></div><h2>어떤 미래에 지원하나요?</h2><p class="description">과학과 연결해 정한 나의 직업을 적어 주세요.</p><div class="field"><label for="job">나의 미래 직업<span class="required">*</span></label><input class="job-input" id="job" name="job" maxlength="36" placeholder="예: 해양 생태 연구원" value="${esc(draft.job)}" required autocomplete="off"></div><div class="field"><label for="class-name">학급<span class="required">*</span></label><input id="class-name" name="class_name" maxlength="30" value="${esc(draft.class_name)}" required autocomplete="off"></div><div class="field-grid"><div class="field"><label for="student-number">출석 번호<span class="required">*</span></label><input id="student-number" name="student_number" type="number" min="1" max="99" inputmode="numeric" value="${esc(draft.student_number)}" placeholder="번호" required autocomplete="off"></div><div class="field"><label for="student-name">이름 또는 별칭<span class="required">*</span></label><input id="student-name" name="student_name" maxlength="20" value="${esc(draft.student_name)}" placeholder="선생님이 알아볼 수 있게" required autocomplete="off"></div></div><label class="check-label"><input type="checkbox" name="acknowledged" ${draft.acknowledged?'checked':''} required><span>명함과 답변에는 전화번호·주소 등 개인정보를 넣지 않습니다.</span></label><div class="error" id="start-error"></div><button class="button full large" type="submit">${draft.image_data_url?'지원서 이어 작성하기':'포트폴리오 작성 시작'}${icon('arrow')}</button><p class="privacy-note">${icon('shield')}<span>완성한 뒤 PDF로 내려받아 선생님께 제출해 주세요.</span></p></form></div><div class="steps-strip"><div class="strip-item"><span class="strip-number">01</span><div><strong>나의 명함 업로드</strong><p>캔바에서 만든 16:9 명함 준비하기</p></div></div><div class="strip-item"><span class="strip-number">02</span><div><strong>다섯 가지 생각 작성</strong><p>과학과 미래, 나의 진로 연결하기</p></div></div><div class="strip-item"><span class="strip-number">03</span><div><strong>완성하고 PDF 제출</strong><p>나만의 포트폴리오 한 장 완성하기</p></div></div></div></section>`,'home');

 <div class="tag-row"><span class="tag-letter g">G</span><div><label for="tag-g">알려주고 싶은 점<small>Give</small></label><textarea id="tag-g" maxlength="200" required placeholder="도움이 될 만한 생각이나 정보를 알려 주세요."></textarea></div></div>
 <div class="error" id="tag-error"></div><div class="tag-actions"><button type="button" class="button ghost small" data-share="end">${icon('logout')}공유 종료</button><button class="button large" id="tag-submit">평가 완료${icon('check')}</button></div></form></div>`;}
function tagDoneHtml(name){return `<div class="tag-wrap"><div class="tag-card tag-done"><div class="success-icon">${icon('check')}</div><h2>${esc(name)}님, 평가를 남겼어요!</h2><p class="tag-sub">‘명함 보기’를 누르고 다음 친구에게 태블릿을 넘겨 주세요.</p><div class="tag-actions" style="justify-content:center"><button type="button" class="button light" data-share="end">${icon('logout')}공유 종료</button><button type="button" class="button large" data-share="card">${icon('card')}명함 보기</button></div></div></div>`;}
function bindTagForm(pg){const f=pg.querySelector('#tag-form');if(!f)return;f.addEventListener('submit',async e=>{e.preventDefault();const btn=f.querySelector('#tag-submit');const v=id=>f.querySelector(id).value.trim();const entry={name:v('#tag-name'),tell:v('#tag-t'),ask:v('#tag-a'),give:v('#tag-g')};if(!entry.name||!entry.tell||!entry.ask||!entry.give)return errorIn('tag-error','이름과 칭찬·질문·조언 세 칸을 모두 적어 주세요.');btn.disabled=true;btn.textContent='저장 중…';try{const list=lsGet(LS_FEEDBACK,[]);list.push({...entry,created_at:new Date().toISOString(),for:receipt.id});if(!lsSet(LS_FEEDBACK,list))throw Error('이 기기에 저장 공간이 부족해요.');const wrap=pg.querySelector('.tag-wrap');wrap.outerHTML=tagDoneHtml(entry.name);pg.scrollTop=0;}catch(err){btn.disabled=false;btn.innerHTML=`평가 완료${icon('check')}`;errorIn('tag-error',(err&&err.message)||'저장하지 못했어요. 다시 시도해 주세요.');}});}
function turnTo(kind){
 if(!shareStage||shareFlipping)return;const cur=shareStage.querySelector('.share-page.top');const next=shareScreen(kind);
 if(kind==='tag')bindTagForm(next);
 if(!cur||reduceMotion()){if(cur)cur.remove();next.classList.add('top');shareStage.appendChild(next);return;}
 shareFlipping=true;next.classList.add('under');shareStage.insertBefore(next,cur);
 let done=false;const finish=()=>{if(done)return;done=true;cur.remove();next.classList.remove('under');next.classList.add('top');shareFlipping=false;};
 cur.addEventListener('animationend',e=>{if(e.target===cur)finish();});setTimeout(finish,1300);
 requestAnimationFrame(()=>cur.classList.add('flip-out'));
}
async function startShare(){
 if(!receipt)return; if(!receipt.image_data_url)return toast('명함 이미지를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.');
 endShare(true);shareStage=document.createElement('div');shareStage.className='share-stage';shareStage.setAttribute('role','dialog');shareStage.setAttribute('aria-label','내 진로 공유하기');
 const first=shareScreen('card');first.classList.add('top');shareStage.appendChild(first);document.body.appendChild(shareStage);document.body.style.overflow='hidden';
 shareStage.addEventListener('click',e=>{const b=e.target.closest('[data-share]');if(b){e.preventDefault();if(b.dataset.share==='end')endShare();else turnTo(b.dataset.share);return;}if(shareFlipping)return;const pg=e.target.closest('.share-page.top');if(!pg)return;if(pg.dataset.screen==='card'&&e.target.closest('.share-card-img'))turnTo('resume');else if(pg.dataset.screen==='resume'&&e.target.closest('.share-resume'))turnTo('tag');});
 try{const el=document.documentElement;if(el.requestFullscreen&&!document.fullscreenElement)await el.requestFullscreen({navigationUI:'hide'});}catch{}
}
function endShare(silent=false){if(shareStage){shareStage.remove();shareStage=null;}shareFlipping=false;document.body.style.overflow='';try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen();}catch{}if(!silent&&receipt)successPage();}
function feedbackCards(list){return list.map(f=>`<article class="fb-card"><header><strong>${esc(f.name)}</strong><span>${f.created_at?timestamp(f.created_at):''}</span></header><div class="fb-line"><b class="t">T</b><div><small>칭찬할 점</small><p>${esc(f.tell)}</p></div></div><div class="fb-line"><b class="a">A</b><div><small>궁금한 점</small><p>${esc(f.ask)}</p></div></div><div class="fb-line"><b class="g">G</b><div><small>알려주고 싶은 점</small><p>${esc(f.give)}</p></div></div></article>`).join('');}
async function feedbackPage(){
 if(!receipt)return home();
 showPage(`<section class="page"><div class="fb-head"><div><div class="eyebrow">TAG RESULTS / 공유 결과</div><h1>친구들이 남긴 평가</h1><p class="description" id="fb-count">불러오는 중…</p></div><div class="inline-actions"><button class="button light" data-action="share-results">${icon('refresh')}새로고침</button><button class="button" data-action="my-submission">${icon('back')}내 포트폴리오로</button></div></div><div id="fb-list"><div class="loading">평가를 불러오고 있어요…</div></div></section>`,'feedback');
 try{const list=lsGet(LS_FEEDBACK,[]).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));if(phase!=='feedback')return;$('#fb-count').textContent=`${receipt.student_name}의 ‘${receipt.job}’에 ${list.length}개의 평가가 도착했어요.`;$('#fb-list').innerHTML=list.length?`<div class="fb-grid">${feedbackCards(list)}</div>`:`<div class="empty-state">${icon('users')}<h3>아직 받은 평가가 없어요.</h3><p>‘내 진로 공유하기’로 친구들에게 명함과 이력서를 보여 주세요.<br>평가는 친구들이 이 기기에서 남긴 것만 보여요.</p></div>`;}
 catch(e){if($('#fb-list'))$('#fb-list').innerHTML=`<div class="empty-state"><h3>평가를 불러오지 못했어요.</h3><p>${esc(e.message||'잠시 후 다시 시도해 주세요.')}</p></div>`;}
}
/* ZIP, stored entries, UTF-8 names. No external CDN dependency. */
/* Central event delegation keeps student text out of executable attributes. */
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action;const id=el.dataset.id;switch(action){
 case 'home':case 'back-home':if(phase==='success'){receipt=null;}home();break;
 case 'pick-file':$('#card-file')?.click();break;
 case 'compose':composePage();break;
 case 'upload':saveDraft();uploadPage();break;
 case 'close-modal':closeModal();break;
 case 'confirm-submit':await submitFinal();break;
 case 'preview-draft':await draftPreview();break;
 case 'download-mine':await downloadMine();break;
 case 'finish-home':receipt=null;home();break;
 case 'my-submission':if(mySubmission){receipt=mySubmission;await successPage();}break;
 case 'share-start':await startShare();break;
 case 'share-results':await feedbackPage();break;
 }});
modal.addEventListener('cancel',e=>{if(busy)e.preventDefault();});
window.addEventListener('beforeunload',e=>{if(busy){e.preventDefault();e.returnValue='';}});
async function init(){document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));$('#mode-label').textContent='진로 포트폴리오';receipt=null;try{sessionStorage.removeItem('majang-receipt');}catch{}mySubmission=lsGet(LS_PORTFOLIO,null);if(mySubmission&&!mySubmission.image_data_url)mySubmission=null;home();}
init();

</script>
